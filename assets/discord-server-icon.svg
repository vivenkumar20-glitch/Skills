<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Terminal Pal</title>
  <desc id="description">A smiling black-and-white terminal with angle bracket eyes and a speech bubble silhouette.</desc>

  <path fill="#000" d="M0 0h512v512H0z"/>

  <!-- The terminal window and its speech bubble tail share one silhouette. -->
  <path fill="#fff" d="M163 135h182c42 0 69 25 69 67v90c0 43-27 70-69 70H210l-48 37c-8 6-19 0-18-10l4-28c-35-6-56-32-56-70v-89c0-42 28-67 71-67Z"/>
  <path fill="#000" d="M161 184h184c28 0 44 17 44 45v63c0 28-16 45-44 45H161c-28 0-44-17-44-45v-63c0-28 16-45 44-45Z"/>

  <!-- Window controls and a command-line prompt. -->
  <g fill="#000">
    <circle cx="144" cy="161" r="5"/>
    <circle cx="161" cy="161" r="5"/>
    <circle cx="178" cy="161" r="5"/>
  </g>
  <path d="m338 156 6 5-6 5m13 1h11" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Angle bracket eyes and an open, rounded smile. -->
  <g fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="m210 228-27 21 27 21m86-42 27 21-27 21"/>
  </g>
  <path fill="#fff" d="M233 275h40c3 0 5 3 4 6-3 13-11 22-24 22s-21-9-24-22c-1-3 1-6 4-6Z"/>
  <path d="m154 275 4 7m8-7 4 7m166-7-4 7m16-7-4 7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- A pixel sparkle echoes the terminal's grid. -->
  <path fill="#fff" d="M385 91h8v8h8v8h8v8h-8v8h-8v8h-8v-8h-8v-8h-8v-8h8v-8h8z"/>
  <path fill="#fff" d="M423 131h6v6h6v6h-6v6h-6v-6h-6v-6h6z"/>
</svg>
